# Skopiuj ten plik jako config.yaml i uzupelnij swoimi danymi.
# config.yaml jest w .gitignore - nie trafi do repozytorium (zawiera sekrety).

tuya:
  # Region centrum danych Tuya wybrany przy tworzeniu projektu w iot.tuya.com
  # (Polska/Europa -> zazwyczaj "eu"). Mozliwe wartosci: eu, eu-w, us, us-e, cn, in, sg
  api_region: "eu"

  # Access ID/Client ID oraz Access Secret/Client Secret Twojego projektu
  # Tuya IoT Platform (zakladka "Overview" projektu w iot.tuya.com).
  access_id: "CHANGE_ME"
  access_secret: "CHANGE_ME"

  # ID urzadzenia "Delfin" znalezione w zakladce "Devices" projektu.
  device_id: "CHANGE_ME"

  # Ustaw na true zeby testowac aplikacje bez prawdziwego czujnika
  # (generuje losowe, przykladowe odczyty).
  mock: false

  # WAZNE: przez Cloud API domyslnie widac tylko czesc parametrow (tzw.
  # "Standard Instruction" tryb projektu w iot.tuya.com pokazuje jedynie
  # tds_in/temp_current/battery_percentage). Zeby zobaczyc reszte (ph,
  # cl_value, orp_value, conductivity_value), w konsoli Tuya wejdz w
  # projekt -> Devices -> Debug Device -> Device Debugging -> link obok
  # "Control Device with Standard" -> wybierz tryb "DP Instruction" i
  # zapisz. Dopiero potem `python -m delfin_monitor discover` pokaze
  # wszystkie kody.
  #
  # Ponizsze wartosci potwierdzono na prawdziwym urzadzeniu (Delfin, Tuya
  # produkt "szjcy" / "Water quality detector"). Jesli masz inny model,
  # uruchom `discover` i porownaj z aplikacja "Moj dom" - Tuya przechowuje
  # liczby dziesietne jako liczby calkowite (np. pH 7.0 -> raw 70 -> scale
  # 10; chlor 0.2 mg/L -> raw 2 -> scale 10).
  dps_mapping:
    ph: {code: "ph", scale: 10}
    chlorine: {code: "cl_value", scale: 10}
    temperature: {code: "temp_current", scale: 10}
    tds: {code: "tds_in", scale: 1}
    ec: {code: "conductivity_value", scale: 1}
    orp: {code: "orp_value", scale: 1}
    battery: {code: "battery_percentage", scale: 1}
    # "salt" nie jest osobnym DP na tym urzadzeniu (aplikacja najpewniej
    # wylicza je z conductivity_value) - zostaw bez mapowania, zawsze
    # bedzie "brak danych" w raporcie.

thresholds:
  ph_min: 7.0
  ph_max: 7.4
  chlorine_min: 0.1

notify:
  enabled: true
  # "ntfy" (Rekomendowane, zero kont/numerow - patrz README.md) albo
  # "callmebot" (alarm na WhatsApp, wymaga numeru telefonu i apikey).
  provider: ntfy

  # Wymagane dla provider: ntfy - dowolna, unikalna nazwa "kanalu"
  # (traktuj jak haslo - kto zna nazwe, moze czytac Twoje powiadomienia).
  ntfy_topic: "CHANGE_ME"

  # Wymagane tylko dla provider: callmebot
  phone: "CHANGE_ME"
  apikey: "CHANGE_ME"

pump:
  # Automatyczne uruchomienie inteligentnego gniazdka "Pompka chlor" (Tuya),
  # gdy chlor spadnie ponizej krytycznego poziomu. To INNY prog niz
  # thresholds.chlorine_min - najpierw dostajesz alarm (chlorine_min),
  # dopiero przy nizszym poziomie (on_below) pompka wlacza sie sama.
  enabled: false

  # Device ID gniazdka "Pompka chlor" - zakladka Devices w iot.tuya.com
  # (albo `python -m delfin_monitor discover --device-id <id>`, zeby
  # potwierdzic kody switch_code/countdown_code dla Twojego urzadzenia -
  # ponizsze sa typowe dla prostych gniazdek Tuya, ale sprawdz).
  device_id: "CHANGE_ME"
  switch_code: "switch_1"

  # Nazwa DP dla wbudowanego countdown/timera (sekundy) - jesli urzadzenie
  # go wspiera (gniazdka Tuya czesto maja "Timer" w apce), pompka sama sie
  # wylaczy po run_seconds bez dodatkowej logiki po naszej stronie. Ustaw
  # na "" jesli urzadzenie tego nie wspiera (wtedy trzeba wylaczyc recznie).
  countdown_code: "countdown_1"
  run_seconds: 300

  on_below: 0.09

report:
  time: "18:00"
  timezone: "Europe/Warsaw"

storage:
  history_file: "data/history.jsonl"
